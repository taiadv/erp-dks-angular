<mat-card>

  <div class="topo">

    <h2>Categorias</h2>

    <button
      mat-raised-button
      color="primary"
      (click)="novaCategoria()">

      <mat-icon>add</mat-icon>
      Nova Categoria

    </button>

  </div>

  <div class="pesquisa">

    <input
      type="text"
      placeholder="Pesquisar por nome ou descrição..."
      (keyup)="aplicarFiltro($event)">

  </div>

  <!-- LOADING -->
  <div class="loading" *ngIf="carregando">

    <mat-spinner diameter="40"></mat-spinner>

    <span>Carregando...</span>

  </div>

  <!-- TABELA -->
  <div class="tabela-container" *ngIf="!carregando">

    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      class="mat-elevation-z2">

      <!-- ID -->
      <ng-container matColumnDef="id">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header>
          ID
        </th>

        <td mat-cell *matCellDef="let categoria">
          {{ categoria.id }}
        </td>

      </ng-container>

      <!-- NOME -->
      <ng-container matColumnDef="nome">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header>
          Nome
        </th>

        <td mat-cell *matCellDef="let categoria">
          {{ categoria.nome }}
        </td>

      </ng-container>

      <!-- DESCRIÇÃO -->
      <ng-container matColumnDef="descricao">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header>
          Descrição
        </th>

        <td mat-cell *matCellDef="let categoria">
          {{ categoria.descricao }}
        </td>

      </ng-container>

      <!-- AÇÕES -->
      <ng-container matColumnDef="acoes">

        <th mat-header-cell *matHeaderCellDef>
          Ações
        </th>

        <td mat-cell *matCellDef="let categoria">

          <!-- EDITAR -->
          <button
            mat-icon-button
            color="primary"
            title="Editar categoria"
            (click)="editarCategoria(categoria)">

            <mat-icon>edit</mat-icon>

          </button>

          <!-- EXCLUIR -->
          <button
            mat-icon-button
            color="warn"
            title="Excluir categoria"
            (click)="excluirCategoria(categoria)">

            <mat-icon>delete</mat-icon>

          </button>

        </td>

      </ng-container>

      <!-- CABEÇALHO -->
      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <!-- LINHAS -->
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns">
      </tr>

      <!-- NENHUM RESULTADO -->
      <tr
        class="mat-row"
        *matNoDataRow>

        <td
          class="mat-cell sem-resultados"
          [attr.colspan]="displayedColumns.length">

          Nenhuma categoria encontrada.

        </td>

      </tr>

    </table>

    <!-- PAGINAÇÃO -->
    <mat-paginator
      [pageSize]="5"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons>
    </mat-paginator>

  </div>

</mat-card>
